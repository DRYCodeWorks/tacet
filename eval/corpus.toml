# tacet's accuracy corpus, read by eval/tacet_eval.py.
#
# Every [[utterance]] is spoken once per voice by macOS `say`, converted to the
# 16 kHz mono 16-bit WAV tacet records, and sent to a private whisper-server.
#
#   id      stable name; the cache key and the row in the per-clip report
#   text    the reference: what a user who said it wants pasted
#   spoken  optional; what `say` is given when it would mangle `text` (tmux,
#           kubectl, file paths). It stands in for how a person says it. It is
#           never scored against.
#
# References are written the way the text should come out, symbols included
# (/etc/hosts, --dry-run). The scorer's normalization reads symbols as the words
# a person speaks for them, so "/etc/hosts" and "slash etc slash hosts" score
# the same: the eval measures recognition, not formatting.
#
# Generated audio lives in eval/.cache/, which is gitignored. Editing a line
# here regenerates that line's audio on the next run.

# Distinct English accents that ship with macOS: US, UK, Australian, Irish.
voices = ["Samantha", "Daniel", "Karen", "Moira"]

