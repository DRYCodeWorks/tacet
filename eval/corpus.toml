# --- Silence and near-silence -------------------------------------------------
#
# Synthesised in Python from a fixed seed, so every run sends the same bytes.
# `dbfs` is the RMS level relative to full scale. tacet drops anything below
# RMS 150 (about -47 dBFS) before whisper sees it, so the clips above that line
# are the ones whose hallucinations would reach a user.
#
#   kind = "zero"    digital silence
#   kind = "white"   white noise
#   kind = "brown"   integrated (room-tone-like) noise
#   kind = "hum"     a mains-hum sine

[[silence]]
id = "zero-1s"
kind = "zero"
seconds = 1.0

[[silence]]
id = "zero-3s"
kind = "zero"
seconds = 3.0

[[silence]]
id = "white-60db"
kind = "white"
seconds = 2.0
dbfs = -60

[[silence]]
id = "brown-50db"
kind = "brown"
seconds = 3.0
dbfs = -50

[[silence]]
id = "white-40db"
kind = "white"
seconds = 2.0
dbfs = -40

[[silence]]
id = "brown-35db"
kind = "brown"
seconds = 3.0
dbfs = -35

[[silence]]
id = "hum-40db"
kind = "hum"
seconds = 2.0
dbfs = -40
